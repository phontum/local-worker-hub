# Local SearXNG for local-worker: bound to 127.0.0.1 only. Started by `local-worker web setup-searxng`,
# which writes the private settings file (with a random secret) next to a copy of this file.
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: local-worker-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:${SEARXNG_PORT:-8888}/
    mem_limit: 512m
