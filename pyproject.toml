[project]
name = "local-worker-hub"
version = "0.1.0"
description = "Scoped local engineering workers for Codex and Claude"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "mcp>=1.26,<2",
    "httpx>=0.28,<1",
    "psutil>=6,<8",
    "trafilatura>=2,<3",
    "playwright>=1.63,<1.64",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
local-worker = "hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
